<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Hall Manager</title>
  <style>
    /* General Styling */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #007bff, #00c6ff); /* Blue Gradient */
      color: #333; /* Darker text color */
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      animation: fadeIn 1s ease-in-out;
    }

    /* Main Container */
    .container {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      width: 100%;
      animation: slideUp 1s ease-in-out;
    }

    /* Panel Styling */
    .panel {
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      transition: transform 0.3s;
    }

    .panel:hover {
      transform: scale(1.05);
    }

    /* Panel Titles */
    h3 {
      font-size: 20px;
      color: #333; /* Dark text for readability */
      margin-bottom: 10px;
    }

    /* Grid Styling */
    .grid-container {
      display: grid;
      gap: 5px;
      margin-top: 10px;
    }

    .grid-cell {
      width: 50px;
      height: 50px;
      background: #e4e7eb;
      border: 1px solid #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    .grid-cell:hover {
      background: #ffeb3b;
      transform: scale(1.1);
    }

    .grid-cell input {
      width: 100%;
      height: 100%;
      text-align: center;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: bold;
      color: #333; /* Dark text inside inputs */
    }

    .grid-cell input:focus {
      outline: none;
    }

    /* Input Fields */
    input {
      width: 80%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: 0.3s;
      color: #333; /* Dark text color inside inputs */
    }

    input:focus {
      border-color: #007bff;
      box-shadow: 0 0 8px #007bff;
    }

    /* Buttons */
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    /* Glowing Add Button */
    .add-button {
      background: linear-gradient(to right, #28a745, #85d17f);
      box-shadow: 0 0 15px rgba(40, 167, 69, 0.5);
    }

    .add-button:hover {
      background: linear-gradient(to right, #218838, #6fcf97);
      box-shadow: 0 0 25px rgba(40, 167, 69, 0.8);
      transform: scale(1.1);
    }

    /* Glowing New Hall Button */
    .new-hall-button {
      background: linear-gradient(to right, #007bff, #4facfe);
      box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
      margin-top: 10px;
    }

    .new-hall-button:hover {
      background: linear-gradient(to right, #0056b3, #40c4ff);
      box-shadow: 0 0 25px rgba(0, 123, 255, 0.8);
      transform: scale(1.1);
    }

    /* Hall Preview */
    .hall-preview-container {
      margin-top: 20px;
    }

    .grid-preview {
      display: grid;
      gap: 5px;
      margin: 10px 0;
    }

    .grid-preview div {
      width: 50px;
      height: 50px;
      border: 1px solid #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      transition: transform 0.3s;
    }

    .grid-preview div:hover {
      transform: rotate(5deg);
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Left Panel -->
    <div class="panel left-panel">
      <h3>Hall Preview</h3>
      <div class="hall-preview-container" id="hallPreviewContainer"></div>
      <button class="new-hall-button" id="newHallButton">New Hall</button>
    </div>

    <!-- Center Panel -->
    <div class="panel center-panel">
      <h3>Hall Name:</h3>
      <input type="text" id="hallName" placeholder="Enter Hall Name" />
      <div class="grid-container" id="gridContainer"></div>
      <button class="add-button" id="addButton">Add</button>
    </div>

    <!-- Right Panel -->
    <div class="panel right-panel">
      <h3>Rows & Cols (n x m):</h3>
      <input type="text" id="gridSize" placeholder="e.g., 5x5" />
      <h3>Unique Values:</h3>
      <input type="text" id="uniqueValues" placeholder="Enter Unique Values" />
    </div>
  </div>

  <script>
    const gridPreviewContainer = document.getElementById('hallPreviewContainer');
    const gridContainer = document.getElementById('gridContainer');
    const gridSizeInput = document.getElementById('gridSize');
    const uniqueValuesInput = document.getElementById('uniqueValues');
    const hallNameInput = document.getElementById('hallName');
    const addButton = document.getElementById('addButton');
    const newHallButton = document.getElementById('newHallButton');

    // Function to generate grid dynamically based on inputs
    function generateGrid(rows, cols, uniqueValues) {
      gridContainer.innerHTML = '';
      gridContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      const values = Array.from({ length: rows * cols }, (_, i) => (i % uniqueValues) + 1);

      values.forEach((value) => {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        const input = document.createElement('input');
        input.type = 'text';
        input.value = value;

        input.addEventListener('input', () => {
          if (!isNaN(input.value)) {
            input.value = input.value.slice(0, 2); // Limit to 2 digits
          }
        });

        cell.appendChild(input);
        gridContainer.appendChild(cell);
      });
    }

    // Add finalized grid to preview
    addButton.addEventListener('click', () => {
      const hallPreview = document.createElement('div');
      hallPreview.className = 'grid-preview';
      const inputs = gridContainer.querySelectorAll('input');
      const [rows, cols] = gridSizeInput.value.split('x').map(Number);

      if (rows && cols) {
        hallPreview.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        hallPreview.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

        inputs.forEach((input) => {
          const previewCell = document.createElement('div');
          previewCell.textContent = input.value || '';
          previewCell.style.border = '1px solid #000';
          previewCell.style.display = 'flex';
          previewCell.style.justifyContent = 'center';
          previewCell.style.alignItems = 'center';
          hallPreview.appendChild(previewCell);
        });

        const hallNamePreview = document.createElement('p');
        hallNamePreview.textContent = hallNameInput.value || 'Unnamed Hall';
        hallPreview.appendChild(hallNamePreview);

        gridPreviewContainer.appendChild(hallPreview);
      }
    });

    // Add a new hall
    newHallButton.addEventListener('click', () => {
      hallNameInput.value = '';
      gridSizeInput.value = '';
      uniqueValuesInput.value = '';
      gridContainer.innerHTML = '';
    });

    // Update grid dynamically
    gridSizeInput.addEventListener('input', () => {
      const [rows, cols] = gridSizeInput.value.split('x').map(Number);
      const uniqueValues = parseInt(uniqueValuesInput.value, 10) || 1;
      if (rows && cols) generateGrid(rows, cols, uniqueValues);
    });

    uniqueValuesInput.addEventListener('input', () => {
      const [rows, cols] = gridSizeInput.value.split('x').map(Number);
      const uniqueValues = parseInt(uniqueValuesInput.value, 10) || 1;
      if (rows && cols) generateGrid(rows, cols, uniqueValues);
    });
  </script>

</body>
</html>
