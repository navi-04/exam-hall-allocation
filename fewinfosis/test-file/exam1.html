    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }

        /* Navbar */
        .navbar {
            background-color: #4682b4; /* Metallic Blue */
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar ul {
            list-style: none;
            padding-right: 100;
             display: flex;
            gap: 15px; /* Add gap between items */
            margin-right: 20px; /* Push navbar items slightly to the right */
        }

        .navbar ul li {
            margin: 60;
        }

        .navbar ul li a {
            text-decoration:none;
            color: white;
            font-weight: bold;
            font-size: 18px; /* Increased font size */
            transition: text-shadow 0.3s ease, color 0.3s ease;
            

        }

        .navbar ul li a:hover {
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8), 
                0 0 20px rgba(255, 215, 0, 0.6), 
                0 0 30px rgba(255, 215, 0, 0.4), 
                0 0 40px rgba(255, 215, 0, 0.3); 
            color: #dce6f0;
            animation: glitter 1s infinite alternate;
        }
        .home-logo-unique {
            height: 60px;
            width: auto;
        }

        /* Glitter animation */
        @keyframes glitter {
            0% {
                text-shadow: 
                    0 0 10px rgba(255, 215, 0, 0.8), 
                    0 0 20px rgba(255, 215, 0, 0.6), 
                    0 0 30px rgba(255, 215, 0, 0.4), 
                    0 0 40px rgba(255, 215, 0, 0.3);
            }
            100% {
                text-shadow: 
                    0 0 20px rgba(255, 215, 0, 0.9), 
                    0 0 30px rgba(255, 215, 0, 0.7), 
                    0 0 40px rgba(255, 215, 0, 0.5), 
                    0 0 50px rgba(255, 215, 0, 0.4);
            }
        }

        .search-bar {
            display: flex;
            align-items: center;
            width: 25%; 
        }

        .search-bar input {
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 55%; 
        }

      
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 50px);
            text-align: center;
        }

        .content h1 {
            font-size: 24px;
            color: #4682b4;
        }
