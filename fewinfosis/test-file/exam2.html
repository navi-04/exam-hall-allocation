<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Folder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }

        /* Navbar */
        .navbar {
            background-color: #8dd35f;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
        }

        .navbar img {
            height: 40px;
            margin-right: 10px;
        }

        .navbar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        .navbar ul li {
            margin: 0 10px;
        }

        .navbar ul li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .search-bar {
            display: flex;
            align-items: center;
        }

        .search-bar input {
            padding: 5px;
            border: none;
            border-radius: 5px;
        }

        .search-bar button {
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Main content */
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 50px);
            text-align: center;
        }

        .circle-container {
            position: relative;
            display: inline-block;
        }

        .content .circle {
            width: 250px;
            height: 250px;
            border: 5px solid #007bff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            position: relative;
        }

        .content img {
            width: 120px;
            height: auto;
        }

        .content button {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .content button:hover {
            background-color: #0056b3;
        }

        .content h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .content p {
            margin-bottom: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="https://via.placeholder.com/40" alt="Logo">
            <span>Exam Hall Allocation</span>
        </div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Allocation</a></li>
            <li><a href="#">Creation</a></li>
            <li><a href="#">Declaration</a></li>
        </ul>
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button><img src="https://via.placeholder.com/20" alt="Search"></button>
        </div>
    </div>

    <div class="content">
        <div>
            <h1>Download Folder</h1>
            <p>file</p>
            <div class="circle-container">
                <button>Download</button>
                <div class="circle">
                    <img src="https://via.placeholder.com/150" alt="Institution Logo">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
