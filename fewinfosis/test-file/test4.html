<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudeep Hover Card</title>
  <style>
    body {
      background-color: #124265;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      position: relative;
      width: 306px;
      height: 380px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    }

    .image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .card-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.4s ease, transform 0.4s ease;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 10;
    }

    .container:hover .card-container {
      opacity: 1;
      transform: scale(1);
    }

    .card-background {
      width: 100%;
      height: 100%;
      background: #DBEFFF;
      border: 2px solid #2487CE;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
    }

    .card-inner {
      width: 90%;
      height: 80%;
      background: #F6FAFD;
      border-radius: 20px;
      padding: 10px;
      text-align: center;
    }

    .card-text {
      font-size: 18px;
      color: #000000;
      line-height: 1.5;
    }

    .card-icons {
      display: flex;
      justify-content: space-around;
      width: 90%;
      margin-top: 10px;
    }

    .card-icons img {
      width: 37px;
      height: 37px;
      object-fit: contain;
    }

    .name {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #266694;
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 10px;
      border-radius: 10px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sudeep Image -->
    <img src="C:\Users\ins9m\OneDrive\Documents\GitHub\exam-hall-allocation\fewinfosis\images\nirmala.jpg" alt="Nirmala ramadas" class="image">

    <!-- Name -->
    <div class="name">NIRMALA<br />RAMADAS</div>

    <!-- Hover Card -->
    <div class="card-container">
      <div class="card-background">
        <div class="card-inner">
          <p class="card-text">
            Hello👋<br>
            I'm Nirmala R from fewinfos.<br>
            front-end developer with expertise in HTML,CSS and Javascript.<br>
            I build user-friendly and visually captivating websites using React.<br>
            Passionate about innovation and delivering cutting-edge solutions.<br>
            Let's create something amazing!
          </p>
        </div>
        <div class="card-icons">
          <img src=".png" alt="Icon 1">
          <img src=".png" alt="Icon 2">
          <img src=".png" alt="Icon 3">
          <img src=".png" alt="Icon 4">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
