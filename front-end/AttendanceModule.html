              class="input-box"
              accept=".xlsx"

            />
          </div>

          <div class="input-group">

              placeholder="Enter percentage limit"
              min="0"
              max="100"
              step="1"
            />

          <button class="notify-btn"  id="enter" onclick="">

        <!-- Right Panel -->
        <div class="right-panel">
          <div class="input-group">

            <select class="dropdown" id="dropdown" onchange="updateTable()">
              <option value="none">None</option>

              <option value="Above Limit">Above Limit</option>
              <option value="Below Limit">Below Limit</option>
            </select>

    <script>

document.getElementById("enter").addEventListener("click", async () => {
    const button = document.getElementById('enter');
    button.disabled = true;

    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];
    const percentage = document.getElementById("percentageInput").value;

    if (!file) {
        alert("Please select an .xlsx file.");
        button.disabled = false;
        return;
    }

    const formData = new FormData();
    formData.append('file', file);
    formData.append('percentage', percentage);

    try {
        const response = await fetch('http://127.0.0.1:5000/attendance_data', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();
        alert(result.message);
    } catch (error) {
        console.error('Error:', error);
        alert('Failed to send data.');
    } finally {
        button.disabled = false;
    }
});

document.getElementById("dropdown").addEventListener("change", async () => {
    const selectedOption = document.getElementById('dropdown').value;

    const payload = { selectedOption };

    try {
        const response = await fetch('http://127.0.0.1:5000/attendance_data_2', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
              });

        const result = await response.json();
        alert(result.message);
    } catch (error) {
        console.error('Error:', error);
        alert('Failed to send data.');
    } 
});


      let studentsData = [];

      // Function to handle file input (CSV)
      function handleFile() {
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];

        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const csvData = e.target.result;
            Papa.parse(csvData, {
              complete: function (results) {
                // Assuming data has headers: Register Number, Attendance Percentage
                studentsData = results.data.slice(1).map((row) => ({
                  regNo: row[0],
                  percentage: parseFloat(row[1]),
                }));
                alert("File loaded successfully!");
              },
            });
          };
          reader.readAsText(file);
        }
      }

      // Function to simulate notifying students
      function notifyStudents() {
        const percentageInput = document
          .getElementById("percentageInput")
          .value.trim();
        if (!percentageInput) {
          alert("Please enter a percentage limit before notifying students.");
          return;
        }
        alert(
          "Students notified for attendance below " + percentageInput + "%!"
        );
      }

      // Function to reset the inputs
      function resetInputs() {
        document.getElementById("fileInput").value = "";
        document.getElementById("percentageInput").value = "";
        document.getElementById("dropdown").value = "";
        document.getElementById(
          "tablePlaceholder"
        ).innerHTML = `<p>Select a category to view student data</p>`;
      }

      // Function to download data
      function downloadData() {
        const csv = Papa.unparse(studentsData);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "attendance_data.csv";
        link.click();
      }
