<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam hall allocation</title>
    <link rel="stylesheet" href="styles.css">    
</head>
<body>
    <div class="card-flip-container">
        <div class="card-flip-inner">
          <!-- Front Side -->
          <div class="card-front">
            <div class="team-member-unique team-center-unique naveen-card">
              <img class="team-naveenraj-image-unique" src="images/naveenraj.jpg" alt="Naveenraj Thiyagarajan">
              <p>NAVEENRAJ THIYAGARAJAN</p>
            </div>
          </div>
      
          <!-- Back Side -->

              <div class="card-background">

                  <p class="card-text">
                    Hello 👋<br>
                    I am Sudeep, a BE-CSE student.<br>
                    An integral part of the FewInfos team.<br>
                    Specialized in Python and backend development.<br>
                    Passionate about crafting innovative tech solutions.<br>
                    Committed to excellence and driving impactful results!
                  </p>
                </div>
                <div class="card-icons">
                  <img src="icon1.png" alt="Icon 1">
                  <img src="icon2.png" alt="Icon 2">
                  <img src="icon3.png" alt="Icon 3">
                  <img src="icon4.png" alt="Icon 4">

              </div>
            </div>
          </div>
        </div>
      </div>
