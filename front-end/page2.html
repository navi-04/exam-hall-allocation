<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Layout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
        }

        .navbar {
            background-color: #003366;
            padding: 10px 20px;
        }

        .navbar-brand img {
            height: 50px;
        }

        .navbar-nav .nav-link {
            margin: 0 15px;
            color: #ffffff !important;
            font-weight: 500;
            font-size: 16px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px auto;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .content-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 20px;
        }

        .control-panel, .info-panel {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 25%;
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 50%;
        }

        .grid-title {
            font-size: 16px;
            font-weight: bold;
            color: #003366;
            margin-bottom: 10px;
        }

        .grid-small {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #003366;
            padding: 10px;
            background-color: #f0f0f0;
            color: #003366;
            font-weight: bold;
            border-radius: 5px;
        }

        .add-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #0066cc;
            background-color: #0066cc;
            color: #ffffff;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .control-panel input, .info-panel input {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .control-panel button, .info-panel button {
            padding: 10px 20px;
            background-color: #0066cc;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .control-panel button:hover, .info-panel button:hover {
            background-color: #004a99;
        }

        .info-panel label, .control-panel label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

    </style>
</head>
<body>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Allocation</a></li>
